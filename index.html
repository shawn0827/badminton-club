<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e3a32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="羽球團">
  <title>羽球團管理</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="homeBrand" class="brand-button" aria-label="回到首頁">
      <span class="brand-icon">🏸</span>
      <span><small>BADMINTON CLUB</small><strong id="clubTitle">羽球團</strong></span>
    </button>
    <button id="accountButton" class="account-button" aria-label="Google 雲端設定">
      <span id="accountAvatar" class="account-avatar">G</span>
      <span id="accountName">未連 Google</span>
    </button>
  </header>

  <main id="app" class="app-shell"></main>

  <nav class="bottom-nav" aria-label="主要功能">
    <button data-route="home" class="active"><span>⌂</span><small>首頁</small></button>
    <button data-route="session"><span>✓</span><small>球局</small></button>
    <button data-route="members"><span>♙</span><small>團員</small></button>
    <button data-route="ledger"><span>≡</span><small>帳務</small></button>
    <button data-route="settings"><span>⚙</span><small>設定</small></button>
  </nav>

  <dialog id="formDialog"><form id="formDialogBody" method="dialog" class="dialog-card"></form></dialog>
  <dialog id="confirmDialog"><form method="dialog" class="dialog-card"><h2 id="confirmTitle">確認</h2><p id="confirmMessage"></p><div class="dialog-actions"><button value="cancel" class="secondary-button">取消</button><button id="confirmOk" value="default" class="danger-button">確定</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span>處理中…</span></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/google.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
